name: Publicar web y APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publicar
  cancel-in-progress: true

jobs:
  web:
    name: Web (GitHub Pages)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deploy
        uses: actions/deploy-pages@v4

  apk:
    name: APK Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Instalar Capacitor
        run: npm install --no-audit --no-fund
      - name: Crear proyecto Android
        run: |
          npx cap add android
          npx cap sync android
      - name: Permisos de ubicación y pantalla encendida
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\n\n    <application|' $M
          F=$(find android/app/src/main/java -name MainActivity.java)
          cat > "$F" <<'JAVA'
          package com.controlrondas.app;

          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.PowerManager;
          import android.provider.Settings;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(RondasPlugin.class);
                  super.onCreate(savedInstanceState);
                  // Para que el GPS y las alarmas sigan con la pantalla apagada: pedir que no se optimice la bateria
                  try {
                      PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                      if (Build.VERSION.SDK_INT >= 23 && pm != null && !pm.isIgnoringBatteryOptimizations(getPackageName())) {
                          Intent i = new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS);
                          i.setData(Uri.parse("package:" + getPackageName()));
                          startActivity(i);
                      }
                  } catch (Exception e) { }
              }

              @Override
              public void onPause() {
                  super.onPause();
                  // no congelar el JavaScript al apagar la pantalla
                  try { getBridge().getWebView().resumeTimers(); getBridge().getWebView().onResume(); } catch (Exception e) { }
              }
          }
          JAVA
          sed -i 's/^          //' "$F"
          cp native/java/*.java "$(dirname "$F")/"
          sed -i 's|</application>|    <service android:name=".GuardService" android:enabled="true" android:exported="false" android:foregroundServiceType="location" />\n    </application>|' $M
          cat $M
      - name: Sonido de alarma e icono de notificación
        run: |
          mkdir -p android/app/src/main/res/raw android/app/src/main/res/drawable
          cp native/raw/alarma.wav android/app/src/main/res/raw/
          cp native/drawable/ic_stat_alarm.xml android/app/src/main/res/drawable/
      - name: Firma fija (para poder actualizar sin desinstalar)
        run: |
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore
      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../control-rondas.apk
      - uses: actions/upload-artifact@v4
        with:
          name: control-rondas-apk
          path: control-rondas.apk
      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Control de Rondas v1.0.${{ github.run_number }}
          make_latest: true
          files: control-rondas.apk
          body: |
            Descarga `control-rondas.apk` en el móvil Android y ábrelo para instalarlo
            (acepta "instalar apps de origen desconocido" si lo pide).
